# Zephyr Kernel Configuration
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging Configuration
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4 # Info level for default Zephyr logs
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_BUFFER_SIZE=1024

# Networking Configuration
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y # Enable UDP for application
CONFIG_NET_L2_NO_PROMISCUOUS_MODE=y
CONFIG_NET_BUF=y
CONFIG_NET_BUF_FIXED_DATA_SIZE=y
CONFIG_NET_BUF_DATA_SIZE=256 # Adjust based on your PDU sizes and MTU
CONFIG_NET_BUF_RX_COUNT=10
CONFIG_NET_BUF_TX_COUNT=10
CONFIG_NET_IPV6_MAX_REXMIT_COUNT=3 # For IPv6 retransmissions

# Timers and Mutexes (used by DECT driver)
CONFIG_TIMESLICING=y
CONFIG_KERNEL_EVENT_LOGGER=y
CONFIG_POLL=y
CONFIG_MUTEX=y
CONFIG_TIMER=y

# Enable Random Number Generation (Crucial for security nonces, etc.)
CONFIG_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y

# Settings subsystem (Optional, uncomment if dect_config needs to save/load persistent settings)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FCB=y # Example backend, choose appropriate one
CONFIG_SETTINGS_FCB_NUM_SECTORS=2

# CRC (for dect_crc.c)
CONFIG_CRC=y

# --- nRF Modem and DECT PHY specific configurations ---
# Enable the nRF modem library
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_DECT_PHY=y # Enable DECT PHY support in the modem library
CONFIG_NRF_MODEM_DECT_PHY=y # Enable the Zephyr driver for the DECT PHY

# Configure modem FOTA if desired (optional)
# CONFIG_NRF_MODEM_LIB_DFU=y

# Set up device tree for modem (usually done by board files, but good to be aware)
# For the nRF9161, modem core configuration might be under a 'modem' node.
# Ensure your board's device tree includes the nRF modem properly.

# --- DECT NR+ Protocol Stack Configuration ---
CONFIG_DECT_NR_PLUS=y # Enable the overall DECT NR+ Protocol Stack

# DECT NR+ Device Role
CONFIG_DECT_NR_PLUS_DEVICE_ROLE_PP=y # Defaulting to Portable Part for sample. Change to _FP for Fixed Part.
CONFIG_DECT_NR_PLUS_DEVICE_ROLE_FP=y

# DECT NR+ Device Identification
CONFIG_DECT_NR_PLUS_MAC_ADDRESS_0=0x00
CONFIG_DECT_NR_PLUS_MAC_ADDRESS_1=0x11
CONFIG_DECT_NR_PLUS_MAC_ADDRESS_2=0x22
CONFIG_DECT_NR_PLUS_MAC_ADDRESS_3=0x33
CONFIG_DECT_NR_PLUS_SHORT_RD_ID=0x0002 # Example: PP uses 0x0002, FP uses 0x0001
CONFIG_DECT_NR_PLUS_INITIAL_CHANNEL=0
CONFIG_DECT_NR_PLUS_MAX_DECT_CHANNELS=10

# DECT NR+ Logging
CONFIG_DECT_NR_PLUS_LOG_LEVEL_DBG=y
CONFIG_DECT_NR_PLUS_LOG_LEVEL=4 # INFO

# MAC Layer Configuration
CONFIG_DECT_NR_PLUS_MAC_THREAD_SLEEP_MS=10
CONFIG_DECT_NR_PLUS_MAC_TX_BUF_COUNT=10
CONFIG_DECT_NR_PLUS_MAC_TX_BUF_SIZE=256
CONFIG_DECT_NR_PLUS_MAC_RX_MSG_QUEUE_SIZE=10
CONFIG_DECT_NR_PLUS_MAC_TX_MSG_QUEUE_SIZE=10
CONFIG_DECT_NR_PLUS_MAC_SCHEDULING_INTERVAL_MS=100
CONFIG_DECT_NR_PLUS_T_MAC_ASSOC_TIMEOUT_MS=5000
CONFIG_DECT_NR_PLUS_MAC_MAX_ASSOC_RETRIES=3
CONFIG_DECT_NR_PLUS_MAC_ENABLE_AUTOMATIC_ASSOCIATION=y # PP automatically associates
CONFIG_DECT_NR_PLUS_T_MAC_INACTIVITY_TIMEOUT_MS=10000
CONFIG_DECT_NR_PLUS_T_MAC_SYNC_TIMEOUT_MS=2000 # PP sync timeout
CONFIG_DECT_NR_PLUS_MAC_MAX_SYNC_RETRIES=5 # PP sync retries
CONFIG_DECT_NR_PLUS_T_MAC_RESOURCE_REQ_TIMEOUT_MS=2000 # Depends on QoS
CONFIG_DECT_NR_PLUS_MAC_MAX_RESOURCE_REQ_RETRIES=3 # Depends on QoS
CONFIG_DECT_NR_PLUS_T_MAC_BEACON_INTERVAL_MS=5000 # FP beacon interval
CONFIG_DECT_NR_PLUS_MAC_MAX_FP_CANDIDATES=5
CONFIG_DECT_NR_PLUS_MAC_MAX_MULTICAST_MEMBERS=4
CONFIG_DECT_NR_PLUS_ENABLE_MOBILITY_SUPPORT=y
CONFIG_DECT_NR_PLUS_T_MAC_HANDOVER_TIMEOUT_MS=5000
CONFIG_DECT_NR_PLUS_MAC_MAX_HANDOVER_RETRIES=3

# DLC Layer Configuration
CONFIG_DECT_NR_PLUS_DLC_THREAD_SLEEP_MS=10
CONFIG_DECT_NR_PLUS_DLC_TX_BUF_COUNT=10
CONFIG_DECT_NR_PLUS_DLC_TX_BUF_SIZE=200
CONFIG_DECT_NR_PLUS_DLC_RX_BUF_COUNT=10
CONFIG_DECT_NR_PLUS_DLC_RX_BUF_SIZE=200
CONFIG_DECT_NR_PLUS_DLC_RX_MSG_QUEUE_SIZE=10
CONFIG_DECT_NR_PLUS_DLC_TX_MSG_QUEUE_SIZE=10
CONFIG_DECT_NR_PLUS_DLC_TX_WINDOW_SIZE=4
CONFIG_DECT_NR_PLUS_DLC_RX_WINDOW_SIZE=4
CONFIG_DECT_NR_PLUS_T_DLC_CONN_TIMEOUT_MS=5000
CONFIG_DECT_NR_PLUS_T_DLC_RELEASE_TIMEOUT_MS=2000
CONFIG_DECT_NR_PLUS_T_DLC_RETRANSMISSION_TIMEOUT_MS=1000
CONFIG_DECT_NR_PLUS_DLC_MAX_RETRANSMISSIONS=5
CONFIG_DECT_NR_PLUS_T_DLC_DELAYED_ACK_MS=50
CONFIG_DECT_NR_PLUS_DLC_RTT_ALPHA_FACTOR=0.125
CONFIG_DECT_NR_PLUS_DLC_RTT_BETA_FACTOR=0.25
CONFIG_DECT_NR_PLUS_DLC_RTT_K_FACTOR=4

# Convergence Layer Configuration
CONFIG_DECT_NR_PLUS_CVG_THREAD_SLEEP_MS=10
CONFIG_DECT_NR_PLUS_CVG_TX_BUF_COUNT=10
CONFIG_DECT_NR_PLUS_CVG_TX_BUF_SIZE=150
CONFIG_DECT_NR_PLUS_CVG_RX_MSG_QUEUE_SIZE=10
CONFIG_DECT_NR_PLUS_CVG_TX_NET_PKT_QUEUE_SIZE=5
CONFIG_DECT_NR_PLUS_T_CVG_REASSEMBLY_TIMEOUT_MS=1000
CONFIG_DECT_NR_PLUS_CVG_MAX_TX_SDUS=5
CONFIG_DECT_NR_PLUS_CVG_MAX_RX_SDUS=5

# Enable 6LoWPAN support within the DECT NR+ driver
CONFIG_DECT_NR_PLUS_ENABLE_6LOWPAN=y

# --- Zephyr 6LoWPAN Stack ---
CONFIG_NET_6LO=y
CONFIG_NET_6LO_CONTEXTS=2 # Number of 6LoWPAN contexts (adjust as needed)
CONFIG_NET_6LO_FRAGMENT=y # Enable 6LoWPAN fragmentation (required for packets > 127 bytes)
CONFIG_NET_6LO_NATIVE_UDP=y # Enable native UDP over 6LoWPAN (if not using full IPv6 UDP header)
CONFIG_NET_6LO_LOWPAN0=y # Enable 6LoWPAN version 0 (RFC 4944)

# Security Layer Configuration
CONFIG_DECT_NR_PLUS_ENABLE_ENCRYPTION=y
CONFIG_DECT_NR_PLUS_T_MAC_SECURITY_TIMEOUT_MS=5000
CONFIG_DECT_NR_PLUS_MAC_MAX_SECURITY_RETRIES=3
CONFIG_DECT_NR_PLUS_SECURITY_MASTER_KEY_LEN_BITS=128
CONFIG_DECT_NR_PLUS_SECURITY_NONCE_LEN_BYTES=16
CONFIG_DECT_NR_PLUS_SECURITY_MIC_LEN_BYTES=4
CONFIG_DECT_NR_PLUS_SECURITY_HKDF_SALT_LEN_BYTES=32

# Routing Layer Configuration
CONFIG_DECT_NR_PLUS_ENABLE_ROUTING=y
CONFIG_DECT_NR_PLUS_T_ROUTING_ROUTE_DISCOVERY_TIMEOUT_MS=5000
CONFIG_DECT_NR_PLUS_ROUTING_ROUTE_EXPIRY_TIMEOUT_S=300
CONFIG_DECT_NR_PLUS_ROUTING_MAX_HOPS=10
CONFIG_DECT_NR_PLUS_ROUTING_MAX_ROUTE_RETRIES=3
CONFIG_DECT_NR_PLUS_ROUTING_MAX_ROUTES=10
CONFIG_DECT_NR_PLUS_ROUTING_THREAD_SLEEP_MS=100

# Channel Management Configuration
CONFIG_DECT_NR_PLUS_ENABLE_CHANNEL_RESELECTION=y
CONFIG_DECT_NR_PLUS_CHANNEL_RESELECTION_RSSI_THRESHOLD_DBM=-85
CONFIG_DECT_NR_PLUS_CHANNEL_MGR_THREAD_SLEEP_MS=1000

# Power Management Configuration
CONFIG_DECT_NR_PLUS_POWER_MGR_THREAD_SLEEP_MS=100
CONFIG_DECT_NR_PLUS_POWER_MGR_INACTIVITY_THRESHOLD_MS=30000

# Physical Layer (PHY) Configuration
CONFIG_DECT_NR_PLUS_ENABLE_LBT=y
CONFIG_DECT_NR_PLUS_LBT_RSSI_THRESHOLD_DBM=-75
CONFIG_DECT_NR_PLUS_LBT_PERIOD_MODEM_UNITS=1000
CONFIG_DECT_NR_PLUS_TX_POWER_DBM_DEFAULT=0

# Enable custom DECT NR+ L2 type for Zephyr networking
CONFIG_NET_L2_DECT_NR_PLUS=y

# Zephyr Kernel
CONFIG_HEAP_MEM_POOL_SIZE=16384 # Increase heap for net_buf and other allocations
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4 # Info level for default Zephyr logs
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_BUFFER_SIZE=1024

# Networking (for net_buf, net_pkt, IPv6 headers)
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y # Enable UDP for application
CONFIG_NET_L2_NO_PROMISCUOUS_MODE=y
CONFIG_NET_BUF=y
CONFIG_NET_BUF_FIXED_DATA_SIZE=y
CONFIG_NET_BUF_DATA_SIZE=256 # Adjust based on your PDU sizes
CONFIG_NET_BUF_RX_COUNT=10
CONFIG_NET_BUF_TX_COUNT=10
CONFIG_NET_IPV6_MAX_REXMIT_COUNT=3 # For IPv6 retransmissions

# Enable custom DECT NR+ L2 type
CONFIG_NET_L2_DECT_NR_PLUS=y

# Timers and Mutexes (used by DECT driver)
CONFIG_TIMESLICING=y
CONFIG_KERNEL_EVENT_LOGGER=y
CONFIG_POLL=y
CONFIG_MUTEX=y
CONFIG_TIMER=y

# Random number generation (for nonces)
CONFIG_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y

# Settings subsystem (if you enable dect_config to use it)
# CONFIG_SETTINGS=y
# CONFIG_SETTINGS_FCB=y # Example backend, choose appropriate one
# CONFIG_SETTINGS_FCB_NUM_SECTORS=2

# CRC (for dect_crc.c)
CONFIG_CRC=y

# --- nRF Modem and DECT PHY specific configurations ---
# Enable the nRF modem library
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_DECT_PHY=y # Enable DECT PHY support in the modem library
CONFIG_NRF_MODEM_DECT_PHY=y    # Enable the Zephyr driver for the DECT PHY

# Configure modem FOTA if desired (optional)
# CONFIG_NRF_MODEM_LIB_DFU=y

# Set up device tree for modem (usually done by board files, but good to be aware)
# For the nRF9161, modem core configuration might be under a 'modem' node.
# Ensure your board's device tree includes the nRF modem properly.

# Enable DECT NR+ Stack (now defined in dect_nr_plus/Kconfig.dect_nr_plus)
CONFIG_DECT_NR_PLUS=y

# --- Zephyr 6LoWPAN Stack ---
CONFIG_NET_6LO=y
CONFIG_NET_6LO_CONTEXTS=2 # Number of 6LoWPAN contexts (adjust as needed)
CONFIG_NET_6LO_FRAGMENT=y # Enable 6LoWPAN fragmentation (required for packets > 127 bytes)
CONFIG_NET_6LO_NATIVE_UDP=y # Enable native UDP over 6LoWPAN (if not using full IPv6 UDP header)
CONFIG_NET_6LO_LOWPAN0=y # Enable 6LoWPAN version 0 (RFC 4944)

# Enable 6LoWPAN support within the DECT NR+ driver
CONFIG_DECT_NR_PLUS_ENABLE_6LOWPAN=y

# You can override DECT NR+ Kconfig defaults here if needed, e.g.:
# CONFIG_DECT_NR_PLUS_DEVICE_ROLE_FP=y
# CONFIG_DECT_NR_PLUS_DEVICE_ROLE_PP=n

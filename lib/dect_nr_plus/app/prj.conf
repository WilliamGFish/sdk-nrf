# General Zephyr configurations
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_NEWLIB_LIBC=y
CONFIG_PRINTF_MILLICORE_LONG_LONG=y # Enable long long for k_uptime_get() logging

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4 # Info level
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_BUFFER_SIZE=1024

# Network Stack
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y # For standard socket API (socket, bind, sendto, recvfrom)
CONFIG_NET_L2_CUSTOM=y # Enable custom L2 (needed for DECT NR+)

# Mandatory for IPv6 autoconf, or if you use link-local addresses
# The DECT NR+ driver will manage the link-local address generation.
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=1
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=1

# DECT NR+ Driver specific configurations (adjust as per your driver's needs)
CONFIG_DECT_NR_PLUS_SUBSYSTEM=y
CONFIG_DECT_NR_PLUS_LOG_LEVEL=4 # Info level for DECT NR+ modules

# CVG Layer (CRITICAL for network stack integration)
CONFIG_DECT_NR_PLUS_CVG_TX_THREAD_STACK_SIZE=1024
CONFIG_DECT_NR_PLUS_CVG_TX_NET_PKT_QUEUE_SIZE=4 # Number of net_pkt's that can be queued for TX
CONFIG_DECT_NR_PLUS_MAX_DLC_PDU_SIZE=200 # Max DLC payload size, adjust if your DLC can send larger PDUs

# Other DECT NR+ modules (ensure these are enabled if your driver depends on them)
CONFIG_DECT_NR_PLUS_CONFIG=y
CONFIG_DECT_NR_PLUS_STATS=y
CONFIG_DECT_NR_PLUS_CHANNEL_MGR=y
CONFIG_DECT_NR_PLUS_POWER_MGR=y
CONFIG_DECT_NR_PLUS_CRYPTO=y
CONFIG_DECT_NR_PLUS_SECURITY=y
CONFIG_DECT_NR_PLUS_MAC=y
CONFIG_DECT_NR_PLUS_DLC=y
CONFIG_DECT_NR_PLUS_BCC=y
CONFIG_DECT_NR_PLUS_ROUTING=y
CONFIG_DECT_NR_PLUS_PHY_NRF9161=y

# Dummy Master Key (Required by dect_crypto.c and dect_security.c if not provided by hardware/config)
# This macro must match the define in your source code.
# If you have a different way to provide the master key, remove this.
# CONFIG_MASTER_KEY_DEFINE=y # Uncomment and define in main.c if your modules need it.

# Application specific configurations
CONFIG_DECT_APP_LOG_LEVEL=4 # Info level for the sample app
CONFIG_DECT_APP_THREAD_STACK_SIZE=1024
CONFIG_DECT_APP_THREAD_PRIORITY=5

# --- Select one role for the application ---
# CONFIG_APP_ROLE_SENDER=y
# CONFIG_APP_ROLE_RECEIVER=y

# If sender role is enabled:
# CONFIG_APP_SENDER_INTERVAL_S=5 # Send interval in seconds
# CONFIG_APP_TARGET_IPV6_ADDR="ff02::1" # Example: IPv6 all-nodes multicast address
# Or a specific peer's link-local address, e.g., "fe80::211:22ff:fe33:4401"
# (Adjust based on your dect_config.mac_address and dect_nr_plus_iface_iid_cb logic)

# If receiver role is enabled:
# CONFIG_APP_RECEIVER_ECHO_RESPONSE=y # Optional: make receiver echo back messages

# Default values for DECT NR+ driver configurations (if not in a custom prj.conf or Kconfig.dect_nr_plus)
# These are examples, adjust based on your driver's actual CONFIG_... definitions.
CONFIG_DECT_NR_PLUS_ROLE_FP=y # Example: Default to Fixed Part
CONFIG_DECT_NR_PLUS_MAX_PEERS=2
CONFIG_DECT_NR_PLUS_DLC_INITIAL_RTT_MS=100
CONFIG_DECT_NR_PLUS_DLC_INITIAL_RTO_MS=200
CONFIG_DECT_NR_PLUS_SECURITY_HANDSHAKE_TIMEOUT_MS=5000
CONFIG_DECT_NR_PLUS_ROUTING_ROUTE_LIFETIME_MS=60000
CONFIG_DECT_NR_PLUS_ROUTING_ROUTE_EXPIRY_CHECK_INTERVAL_S=10
CONFIG_DECT_NR_PLUS_ROUTING_MAX_HOPS=10
CONFIG_DECT_NR_PLUS_POWER_TRANSITION_DELAY_MS=100
CONFIG_DECT_NR_PLUS_MAC_TX_BUF_COUNT=8
CONFIG_DECT_NR_PLUS_MAC_TX_BUF_SIZE=256
CONFIG_DECT_NR_PLUS_MAC_RX_BUF_COUNT=8
CONFIG_DECT_NR_PLUS_MAC_RX_BUF_SIZE=256
CONFIG_DECT_NR_PLUS_ROUTING_RX_QUEUE_SIZE=4
CONFIG_DECT_NR_PLUS_ROUTING_TX_QUEUE_SIZE=4

# Required for Zephyr's internal network interface naming convention for custom L2
CONFIG_DECT_NR_PLUS_NET_IF_NAME="dect0" # Define a name for your network interface
